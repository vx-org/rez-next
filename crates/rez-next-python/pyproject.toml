[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rez-next"
version = "0.3.12"  # x-release-please-version
description = "High-performance Rust package manager with Rez-compatible workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
keywords = ["rez", "package-manager", "vfx", "pipeline", "environment"]

[project.urls]
Homepage = "https://github.com/vx-org/rez-next"
Documentation = "https://github.com/vx-org/rez-next"
Repository = "https://github.com/vx-org/rez-next"
Issues = "https://github.com/vx-org/rez-next/issues"

[tool.maturin]
# Build the cdylib as Python extension
features = ["pyo3/extension-module"]
# Python module name: native extension is installed as rez_next._native,
# so Python layer (python/rez_next/__init__.py) can do `from rez_next._native import *`
module-name = "rez_next._native"
# Python source directory: tells maturin where to find the Python package files
python-source = "python"
python-packages = ["rez_next", "rez"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/*.pdb"]
# Disable strip to avoid conflict with pyo3 abi3 --include-debuginfo
strip = false

[project.optional-dependencies]
# `tomli` is only needed to read TOML on Python < 3.11; 3.11+ uses stdlib
# `tomllib`. Declared explicitly so the manifest tests do not depend on it
# being pulled in transitively.
# `pytest<9.2`: pytest 9.2 dropped the private Function._nodeid attribute that
# pytest-benchmark reads at fixture setup (AttributeError on the benchmark
# fixture). Bound it here so `pip install .[test]` / `uv sync` stay reproducible;
# the CI jobs pin the same range explicitly.
test = ["maturin>=1.0,<2.0", "pytest>=8,<9.2", "pytest-benchmark", "tomli; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]


[package]
name = "rez-next-version"
version = "0.3.13" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Ultra-fast version parsing and comparison with 117x performance improvement - core component of Rez-Next"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/vx-org/rez-next"
documentation = "https://docs.rs/rez-next-version"
readme = "README.md"
keywords = ["version", "parsing", "semver", "rez", "performance"]
categories = ["development-tools", "parsing", "data-structures"]
exclude = ["benches/", "tests/fixtures/"]

[lib]
name = "rez_next_version"
crate-type = ["rlib"]

[dependencies]
rez-next-common = { version = "0.3.13", path = "../rez-next-common", default-features = false } # x-release-please-version
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
thiserror.workspace = true
# Performance optimization dependencies
ahash = "0.8"
smallvec = "1.15"
once_cell = "1.21"

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "version_benchmark"
harness = false
path = "../../benches/version_benchmark.rs"



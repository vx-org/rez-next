name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - comprehensive

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Quick benchmarks — version + package + rex  (~2 min, every PR)
  # ─────────────────────────────────────────────────────────────────────────
  bench-quick:
    name: Quick Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-quick-v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run quick benchmarks (version + package + rex)
        env:
          CRITERION_QUICK: "1"
        run: |
          cargo bench \
            --bench version_benchmark \
            --bench simple_package_benchmark \
            --bench rex_benchmark \
            2>&1 | tee benchmark-quick.txt

      - name: Parse Criterion output → JSON
        run: |
          python metrics/benchmarking/scripts/parse_criterion.py \
            benchmark-quick.txt > benchmark-quick.json
          echo "=== Parsed results ==="
          cat benchmark-quick.json

      - name: Generate RESULTS.md (quick subset)
        run: |
          python metrics/benchmarking/scripts/generate_results.py \
            --bench-json benchmark-quick.json \
            --out metrics/benchmarking/RESULTS.md
          echo "=== RESULTS.md preview ==="
          head -60 metrics/benchmarking/RESULTS.md

      - name: Upload quick benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-quick-${{ github.sha }}
          path: |
            benchmark-quick.txt
            benchmark-quick.json
            metrics/benchmarking/RESULTS.md
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Full benchmark suite — preserve measurements before attempting publication
  # ─────────────────────────────────────────────────────────────────────────
  bench-full:
    name: Full Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.benchmark_type == 'comprehensive')

    permissions:
      contents: read

    outputs:
      report_artifact_id: ${{ steps.report-bundle.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-full-v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run full benchmark suite
        env:
          CRITERION_QUICK: "1"
        run: |
          cargo bench \
            --bench version_benchmark \
            --bench package_benchmark \
            --bench simple_package_benchmark \
            --bench rex_benchmark \
            --bench solver_bench_v2 \
            --bench solver_real_repo_bench \
            --bench context_operations_benchmark \
            --bench depends_benchmark \
            --bench pip_conversion_benchmark \
            --bench cache_operations_benchmark \
            2>&1 | tee benchmark-full.txt

      - name: Parse Criterion output → JSON
        run: |
          python metrics/benchmarking/scripts/parse_criterion.py \
            benchmark-full.txt > benchmark-full.json
          echo "=== Parsed results ==="
          python -c "
          import json, sys
          d = json.load(open('benchmark-full.json'))
          print(f'Total benchmarks: {len(d[\"results\"])}')
          print(f'Regressions: {d[\"regressions\"]}')
          for r in d['results']:
              print(f'  {r[\"name\"]:<50} {r[\"mean_human\"]}')
          "

      - name: Generate RESULTS.md (full suite)
        run: |
          python metrics/benchmarking/scripts/generate_results.py \
            --bench-json benchmark-full.json \
            --out metrics/benchmarking/RESULTS.md

      - name: Show regression summary
        run: |
          python -c "
          import json, sys
          d = json.load(open('benchmark-full.json'))
          regressions = d.get('regressions', [])
          if regressions:
              print('::warning::Performance regressions detected: ' + ', '.join(regressions))
          else:
              print('No performance regressions detected.')
          "

      - name: Save result bundle for independent publication retries
        id: report-bundle
        uses: actions/upload-artifact@v7
        with:
          name: bench-full-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            metrics/benchmarking/RESULTS.md
            metrics/benchmarking/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload full benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-full.txt
            benchmark-full.json
            metrics/benchmarking/RESULTS.md
            metrics/benchmarking/artifacts/
            target/criterion/
          retention-days: 30

  # This job can be retried without rerunning the expensive measurements.
  publish-results:
    name: Publish Benchmark Results
    needs: [bench-full]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download the measured commit's saved result bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.bench-full.outputs.report_artifact_id }}
          path: metrics/benchmarking/

      - name: Publish only while main still matches the measured commit
        env:
          MEASURED_SHA: ${{ github.sha }}
        run: python metrics/benchmarking/scripts/publish_results.py --measured-sha "$MEASURED_SHA"

  # ─────────────────────────────────────────────────────────────────────────
  # Regression gate — fail PR if any Criterion regression detected
  # ─────────────────────────────────────────────────────────────────────────
  regression-check:
    name: Regression Gate
    runs-on: ubuntu-latest
    needs: [bench-quick]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Download quick bench results
        uses: actions/download-artifact@v8
        with:
          name: bench-quick-${{ github.sha }}
          path: bench-artifacts/

      - name: Check for regressions
        run: |
          python -c "
          import json, sys
          d = json.load(open('bench-artifacts/benchmark-quick.json'))
          regressions = d.get('regressions', [])
          if regressions:
              print(f'FAIL: {len(regressions)} regression(s): {regressions}')
              sys.exit(1)
          print(f'PASS: No regressions ({len(d[\"results\"])} benchmarks checked).')
          "
